name: Migrate AWS secrets to GitHub (one-shot)
on: workflow_dispatch

jobs:
  migrate:
    environment: prod
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      GH_TOKEN: ${{ secrets.MIGRATE_PAT }}
    steps:
      - name: Fetch and copy
        run: |
          JSON=$(aws secretsmanager get-secret-value --secret-id prod/poppick \
                   --query SecretString --output text)
          echo "== keys in prod/poppick =="
          echo "$JSON" | jq -r 'keys[]'

          for k in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET JWT_SECRET_KEY; do
            v=$(echo "$JSON" | jq -er --arg k "$k" '.[$k]') || { echo "missing: $k"; continue; }
            echo "::add-mask::$v"
            gh secret set "$k" --env prod --repo "$GITHUB_REPOSITORY" --body "$v"
            echo "set: $k"
          done
